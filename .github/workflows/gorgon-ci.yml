name: Gorgon CI

on:
  push:
    branches:
      - main
      - 'fix/*'
      - 'feature/*'
      - 'ci/*'
  pull_request:
    branches:
      - main
      - 'fix/*'
      - 'feature/*'

env:
  BUILD_TYPE: Release

jobs:
  # LINUX BUILD
  linux-build:
    name: Linux (GCC)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libx11-dev libxinerama-dev libxrandr-dev libxext-dev \
            libpng-dev libjpeg-dev zlib1g-dev liblzma-dev \
            doxygen libfreetype-dev libpulse-dev libfontconfig1-dev \
            libflac-dev libogg-dev libvorbis-dev libcurl4-openssl-dev \
            libgl1-mesa-dev libglew-dev

      - name: Configure
        run: cmake -S . -B build/Default -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -G Ninja

      - name: Build
        run: cmake --build build/Default --parallel

      - name: Install SDK and Prepare Distribution
        run: |
          mkdir -p dist/include
          cmake --install build/Default --prefix dist
          if [ -d "Source/Gorgon" ]; then
            cp -r Source/Gorgon/* dist/include/
          fi
          if [ -d "Docs/html" ]; then
            mkdir -p dist/Docs
            cp -r Docs/html/* dist/Docs/
          fi

      - name: Package SDK
        run: tar -czf Gorgon-Linux-SDK.tar.gz -C dist .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gorgon-Linux-SDK
          path: Gorgon-Linux-SDK.tar.gz

  # WINDOWS BUILD
  windows-build:
    name: Windows (MSVC + vcpkg)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: |
            vcpkg/installed/x64-windows
            vcpkg/packages
          key: vcpkg-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Install Dependencies (vcpkg)
        run: |
          if not exist vcpkg (
            git clone https://github.com/microsoft/vcpkg.git
          )
          call .\vcpkg\bootstrap-vcpkg.bat
          
          :: Manifest mode: Uses vcpkg.json automatically.
          :: We use --x-feature to enable the optional bits in your vcpkg.json
          .\vcpkg\vcpkg install --triplet x64-windows ^
            --x-feature=freetype ^
            --x-feature=flac ^
            --x-feature=ogg ^
            --x-feature=vorbis ^
            --x-feature=curl
        shell: cmd

      - name: Configure and Build
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake -S . -B build ^
            -G Ninja ^
            -DCMAKE_BUILD_TYPE=%BUILD_TYPE% ^
            -DCMAKE_TOOLCHAIN_FILE=%CD%\vcpkg\scripts\buildsystems\vcpkg.cmake ^
            -DVCPKG_TARGET_TRIPLET=x64-windows
            -DVCPKG_MANIFEST_MODE=ON
          
          cmake --build build --parallel
        shell: cmd

      - name: Install Gorgon SDK
        run: |
          if not exist dist mkdir dist
          cmake --install build --config Release --prefix dist
          if exist Source\Gorgon (
            if not exist dist\include mkdir dist\include
            xcopy Source\Gorgon dist\include /E /I /Y
          )
        shell: cmd

      - name: Package Gorgon SDK
        run: 7z a Gorgon-Windows-SDK.zip .\dist\*
        shell: cmd

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gorgon-Windows-SDK
          path: Gorgon-Windows-SDK.zip
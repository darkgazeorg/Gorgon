name: Gorgon CI

on:
  push:
    branches:
      - main
      - 'fix/*'
      - 'feature/*'
      - 'ci/*'
  pull_request:
    branches:
      - main
      - 'fix/*'
      - 'feature/*'

env:
  BUILD_TYPE: Release

jobs:

  # LINUX BUILD
  linux-build:
    name: Linux (GCC)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libx11-dev libxinerama-dev libxrandr-dev libxext-dev \
            libpng-dev libjpeg-dev zlib1g-dev liblzma-dev \
            doxygen libfreetype-dev libpulse-dev libfontconfig1-dev \
            libflac-dev libogg-dev libvorbis-dev libcurl4-openssl-dev \
            libgl1-mesa-dev libglew-dev

      - name: Configure
        run: cmake -S . -B build/Default -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -G Ninja

      - name: Build
        run: cmake --build build/Default --parallel

      - name: Install SDK and Prepare Distribution
        run: |
          mkdir -p dist
          cmake --install build/Default --prefix dist

          # Copy headers if install target doesn't handle them
          cp -r Source/Gorgon/* dist/include/

          # Copy Doxygen documentation if available
          if [ -d Docs/html ]; then
            mkdir -p dist/Docs
            cp -r Docs/html/* dist/Docs/
          fi

      - name: Package SDK
        run: tar -czf Gorgon-Linux-SDK.tar.gz -C dist .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gorgon-Linux-SDK
          path: Gorgon-Linux-SDK.tar.gz

  # WINDOWS BUILD
  windows-build:
    name: Windows (MSVC + vcpkg)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: |
            vcpkg/installed/x64-windows
            vcpkg/packages
          key: vcpkg-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Install Tools
        run: |
          choco install ninja -y
          choco install doxygen.install -y
          choco install 7zip -y
        shell: cmd

      - name: Setup vcpkg
        run: |
          if not exist vcpkg (
            git clone https://github.com/microsoft/vcpkg.git
          )
          .\vcpkg\bootstrap-vcpkg.bat
          .\vcpkg\vcpkg install ^
            zlib:x64-windows ^
            libpng:x64-windows ^
            libjpeg-turbo:x64-windows ^
            glew:x64-windows ^
            freetype:x64-windows ^
            liblzma:x64-windows
        shell: cmd

      - name: Configure CMake
        run: |
          cmake -S . -B build ^
            -G Ninja ^
            -A x64 ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_TOOLCHAIN_FILE=%CD%\vcpkg\scripts\buildsystems\vcpkg.cmake ^
            -DVCPKG_TARGET_TRIPLET=x64-windows
        shell: cmd

      - name: Build
        run: cmake --build build --parallel
        shell: cmd

      - name: Install Gorgon SDK
        run: |
          REM Create dist folder
          mkdir dist

          REM Install build artifacts
          cmake --install build --config Release --prefix dist

          REM Copy headers if not installed by CMake
          if exist Source\Gorgon (
            xcopy Source\Gorgon dist\include /E /I /Y
          )

          REM Copy Doxygen documentation if available
          if exist Docs\HTML (
            mkdir dist\Docs
            xcopy Docs\HTML dist\Docs /E /I /Y
          )
        shell: cmd

      - name: Package Gorgon SDK
        run: |
          7z a Gorgon-Windows-SDK.zip .\dist\*
        shell: cmd

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gorgon-Windows-SDK
          path: Gorgon-Windows-SDK.zip
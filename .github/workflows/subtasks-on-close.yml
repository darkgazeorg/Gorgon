name: Enforce issue checklist & create extra subtasks

on:
  issues:
    types: [closed]

permissions:
  issues: write

jobs:
  handle-issue-close:
    name: Check closed issue for incomplete tasks and handle [extra]
    runs-on: ubuntu-latest
    steps:
      - name: Parse issue body and enforce rules
        uses: actions/github-script@v6
        with:
          script: |
            const issue = context.payload.issue;
            if (!issue) {
              core.info("No issue in payload — exiting.");
              return;
            }

            const issueNumber = issue.number;
            const repoOwner = context.repo.owner;
            const repoName = context.repo.repo;
            const body = issue.body || "";

            // Negative gate: if label 'no-subtask-automation' present, exit
            const labels = (issue.labels || []).map(l => (typeof l === 'string') ? l.toLowerCase() : (l.name || '').toLowerCase());
            if (labels.includes('no-subtask-automation')) {
              core.info("Issue has 'no-subtask-automation' label — skipping automation.");
              return;
            }

            // Extract checklist lines like "- [ ] task text [extra]"
            const checklistRegex = /^\s*[-*]\s+\[\s\]\s*(.+?)(?:\s*\[(extra|optional|cancelled)\])?\s*$/i;
            const lines = body.split(/\r?\n/);

            const uncheckedNonExempt = [];
            const uncheckedExtra = [];
            const uncheckedOptional = [];

            for (const line of lines) {
              const m = line.match(checklistRegex);
              if (m) {
                const taskText = m[1].trim();
                const marker = (m[2] || "").toLowerCase();
                if (marker === "extra") {
                  uncheckedExtra.push(taskText);
                } else if (marker === "optional") {
                  uncheckedOptional.push(taskText);
                } else if (marker === "cancelled") {
                  // cancelled — exempt
                } else {
                  // no exempt marker — treat as required
                  uncheckedNonExempt.push(taskText);
                }
              }
            }

            // If there are required incomplete tasks, reopen and comment.
            if (uncheckedNonExempt.length > 0) {
              const commentBody = [
                `:warning: This issue was closed but contains ${uncheckedNonExempt.length} incomplete required task(s). The issue will be reopened until these are completed.`,
                "",
                "Incomplete required tasks:",
                ...uncheckedNonExempt.map(t => `- ${t}`),
                "",
                "If some of these should be considered optional, cancelled, or extra subtasks, append `[optional]`, `[cancelled]`, or `[extra]` to the checklist item line so the automation will ignore them on close.",
              ].join("\n");

              await github.rest.issues.createComment({
                owner: repoOwner,
                repo: repoName,
                issue_number: issueNumber,
                body: commentBody,
              });

              // Reopen the issue
              await github.rest.issues.update({
                owner: repoOwner,
                repo: repoName,
                issue_number: issueNumber,
                state: "open",
              });

              core.info(`Reopened issue #${issueNumber} because of ${uncheckedNonExempt.length} required incomplete tasks.`);
              return;
            }

            // All required tasks are complete — create a single issue for unchecked [extra] items (if any).
            // If extras exist, include optional items as well; if no extras exist but optional items do, do nothing.
            if (uncheckedExtra.length > 0) {
              // Title: if only one task, use that task as the title; otherwise use "Extra tasks for [original task name]"
              const title = (uncheckedExtra.length + uncheckedOptional.length) === 1 ? uncheckedExtra[0] : `Extra tasks for ${issue.title}`;

              // Build checklist lines, marking each as [extra]
              let taskLines = uncheckedExtra.map(t => `- [ ] ${t} [extra]`).join("\n") + "\n";
              taskLines += uncheckedOptional.map(t => `- [ ] ${t} [optional]`).join("\n");

              const subBody = [
                // Task list first
                taskLines,
                "",
                // Auto-created notice below the task list
                `Auto-created subtask(s) from parent issue #${issueNumber} (${issue.title}).`,
                "",
                `Parent issue: ${issue.html_url}`
              ].join("\n");

              const created = await github.rest.issues.create({
                owner: repoOwner,
                repo: repoName,
                title,
                body: subBody,
              });

              core.info(`Created aggregated extra issue for tasks: ${tasksForIssue.join(",")}`);

              // Add a comment summarizing created subtask issue and listing tasks
              let createdList = uncheckedExtra.map(t => `- ${t} [extra]`).join("\n") + "\n";
              createdList += uncheckedOptional.map(t => `- ${t} [optional]`).join("\n");
              const commentToParent = [
                `The following unchecked checklist items marked with ` + "`[extra]`" + ` were consolidated into a single auto-created issue:",
                "",
                createdList,
                "",
                `Created issue: ${created.data.html_url}`
              ].join("\n");

              await github.rest.issues.createComment({
                owner: repoOwner,
                repo: repoName,
                issue_number: issueNumber,
                body: commentToParent,
              });
            } else if (uncheckedOptional.length > 0) {
              // There are optional items but no extras — do not create an issue per instructions.
              core.info("Unchecked optional tasks present but no extras — no aggregated issue will be created.");
            } else {
              core.info("No unchecked [extra] tasks to create.");
            }

